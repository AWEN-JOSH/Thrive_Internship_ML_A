<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f7f6; }
        .header { background: #232f3e; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-number { font-size: 32px; font-weight: bold; color: #ff9900; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #232f3e; color: white; }
        .btn { background: #ff9900; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .logout { background: #dc3545; float: right; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍ Coordinator Dashboard</h1>
        <p id="schoolName">Loading school...</p>
    </div>
    
    <div class="container">
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="loadDashboard()">🔄 Refresh Data</button>
            <button class="btn logout" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="totalStudents">0</div><div>Total Students</div></div>
            <div class="stat-card"><div class="stat-number" id="checkedIn">0</div><div>Checked In</div></div>
            <div class="stat-card"><div class="stat-number" id="verifiedCount" style="color: green;">0</div><div>Verified Present</div></div>
            <div class="stat-card"><div class="stat-number" id="photoCount" style="color: blue;">0</div><div>Photos Taken</div></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Visit Day</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Distance</th>
                    <th>Status</th>
                    <th>Photo</th>
                </tr>
            </thead>
            <tbody id="attendanceTable">
                <tr><td colspan="7" style="text-align:center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // YOUR DASHBOARD LAMBDA URL
        const DASHBOARD_URL = 'https://rb2wxcvtgxemegalw7vxqqw5qm0ggzbf.lambda-url.us-east-1.on.aws/';

        const coordData = JSON.parse(localStorage.getItem('coordinator') || '{}');
        
        if (!coordData.coordinator_id) {
            window.location.href = 'coordinator-login.html';
        } else {
            document.getElementById('schoolName').textContent = `School: ${coordData.school_id}`;
        }

        async function loadDashboard() {
            try {
                const response = await fetch(DASHBOARD_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ school_id: coordData.school_id })
                });
                const data = await response.json();
                
                document.getElementById('totalStudents').textContent = data.total_students || 0;
                document.getElementById('checkedIn').textContent = data.checked_in || 0;
                document.getElementById('verifiedCount').textContent = data.verified_present || 0;
                document.getElementById('photoCount').textContent = data.photos_captured || 0;

                const tbody = document.getElementById('attendanceTable');
                tbody.innerHTML = '';

                if (data.students && data.students.length > 0) {
                    data.students.forEach(s => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${s.student_name || s.student_id}</td>
                            <td>${s.visit_day || 'N/A'}</td>
                            <td>${s.check_in ? new Date(s.check_in).toLocaleTimeString() : '-'}</td>
                            <td>${s.check_out ? new Date(s.check_out).toLocaleTimeString() : '-'}</td>
                            <td>${s.distance_meters ? Math.round(s.distance_meters) + 'm' : '-'}</td>
                            <td style="color: ${s.verified ? 'green' : 'red'}">${s.verified ? '✅ Verified' : '❌ Unverified'}</td>
                            <td>${s.photo_captured ? '📸 Yes' : 'No'}</td>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No attendance records found for today.</td></tr>';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function logout() {
            localStorage.removeItem('coordinator');
            window.location.href = 'coordinator-login.html';
        }

        loadDashboard();
    </script>
</body>
</html>
