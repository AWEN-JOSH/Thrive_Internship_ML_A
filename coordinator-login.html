    <script>
        const COORDINATOR_LOGIN_URL = 'https://gzduysxv7ddbaklpe7b3wdwl7i0jgshn.lambda-url.us-east-1.on.aws/';

        async function coordinatorLogin() {
            const coordId = document.getElementById('coordinatorId').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Validation
            if (!coordId || !password) {
                errorMsg.textContent = '️ Please enter both Coordinator ID and Password';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            const btn = document.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                const response = await fetch(COORDINATOR_LOGIN_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        coordinator_id: coordId,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store coordinator info in localStorage
                    localStorage.setItem('coordinator', JSON.stringify({
                        coordinator_id: data.coordinator_id,
                        school_id: data.school_id,
                        expiry_date: data.expiry_date,
                        login_time: new Date().toISOString()
                    }));
                    
                    // Redirect to dashboard
                    window.location.href = 'coordinator-dashboard.html';
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Login failed');
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = ' Connection error. Please check: 1) Your internet connection 2) Lambda URL is correct 3) CORS is enabled in Lambda settings';
                errorMsg.style.display = 'block';
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                coordinatorLogin();
            }
        });
    </script>
