<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Login - AWEN-STS</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #232f3e; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #ff9900; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e68a00; }
        .error { color: red; text-align: center; margin-top: 15px; display: none; background: #fdecea; padding: 10px; border-radius: 5px; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>👨‍🏫 Coordinator Login</h1>
        <input type="text" id="coordinatorId" placeholder="Coordinator ID">
        <input type="password" id="password" placeholder="Password">
        <button onclick="coordinatorLogin()">Login to Dashboard</button>
        <div id="errorMsg" class="error"></div>
        <div class="back-link">
            <a href="index.html">← Back to Student Login</a>
        </div>
    </div>

    <script>
        // YOUR COORDINATOR LOGIN LAMBDA URL
        const COORDINATOR_LOGIN_URL = 'https://gzduysxv7ddbaklpe7b3wdwl7i0jgshn.lambda-url.us-east-1.on.aws/';

        async function coordinatorLogin() {
            const coordId = document.getElementById('coordinatorId').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!coordId || !password) {
                errorMsg.textContent = 'Please enter both ID and Password';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(COORDINATOR_LOGIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinator_id: coordId, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('coordinator', JSON.stringify(data));
                    window.location.href = 'coordinator-dashboard.html';
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Login failed');
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error. Check console.';
                errorMsg.style.display = 'block';
                console.error(error);
            }
        }
    </script>
</body>
</html>
